<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stopwatch Defense</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link
        href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Roboto+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="hud">
                <div class="hud-left">
                    <div id="wave-container">Wave: <span id="wave">1</span></div>
                    <div id="health-container">HP: <span id="health">100</span></div>
                </div>
                <div class="hud-right">
                    <div id="score-container">COIN: <span id="score">0</span></div>
                    <button id="shop-btn">SHOP</button>
                    <button id="menu-btn">MENU</button>
                </div>
            </div>
            <div id="stopwatch-display">00.00</div>
            <div id="message-area"></div>

            <div id="debug-menu"
                style="display: none; position: absolute; top: 80px; right: 20px; z-index: 1000; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; color: white; font-family: 'Roboto Mono', monospace; pointer-events: auto;">
                <label>Jump to:</label>
                <select id="wave-select" style="background: black; color: white; border: 1px solid #555;">
                    <option value="1">Wave 1</option>
                    <option value="2">Wave 2</option>
                    <option value="3">Wave 3 (Boss A)</option>
                    <option value="4">Wave 4</option>
                    <option value="5">Wave 5</option>
                    <option value="6">Wave 6 (Boss B)</option>
                    <option value="7">Wave 7</option>
                    <option value="8">Wave 8</option>
                    <option value="9">Wave 9 (Boss C)</option>
                    <option value="10">Wave 10</option>
                    <option value="12">Wave 12 (Boss D)</option>
                    <option value="15">Wave 15 (Boss E)</option>
                </select>
                <button id="wave-jump-btn"
                    style="background: #333; color: white; border: 1px solid #555; cursor: pointer;">GO</button>
            </div>

            <div id="pause-screen" class="screen hidden">
                <h1>PAUSED</h1>
                <button id="resume-btn">RESUME</button>
                <button id="music-toggle-btn">MUSIC: ON</button>
                <button id="pause-menu-btn">MAIN MENU</button>
            </div>

            <div id="shop-screen" class="screen hidden">
                <h2>SHOP</h2>
                <div id="coins-display">Coins: <span id="shop-coins">0</span></div>
                <div class="shop-items">
                    <div class="shop-item" data-item="radius">
                        <img src="img/icon_radius.png" alt="Radius" class="shop-icon">
                        <div class="shop-info">
                            <span class="shop-name">Radius</span>
                            <div class="level-indicator">
                                <div class="pip empty"></div>
                                <div class="pip empty"></div>
                            </div>
                            <button class="buy-btn">100</button>
                        </div>
                    </div>
                    <div class="shop-item" data-item="power">
                        <img src="img/icon_power.png" alt="Power" class="shop-icon">
                        <div class="shop-info">
                            <span class="shop-name">Power</span>
                            <div class="level-indicator">
                                <div class="pip empty"></div>
                                <div class="pip empty"></div>
                            </div>
                            <button class="buy-btn">150</button>
                        </div>
                    </div>
                    <!-- Tolerance Removed -->
                    <div class="shop-item" data-item="heal">
                        <img src="img/icon_repair.png" alt="Repair" class="shop-icon">
                        <div class="shop-info">
                            <span class="shop-name">Repair</span>
                            <div class="level-desc">+20 HP</div>
                            <button class="buy-btn">100</button>
                        </div>
                    </div>
                    <div class="shop-item" data-item="maxHealth">
                        <img src="img/icon_fortify.png" alt="Fortify" class="shop-icon">
                        <div class="shop-info">
                            <span class="shop-name">Fortify</span>
                            <div class="level-desc">+10 Max HP</div>
                            <button class="buy-btn">100</button>
                        </div>
                    </div>
                </div>
                <button id="close-shop-btn">Resume</button>
            </div>
            <div id="start-screen" class="screen">
                <!-- Title is part of background image now -->
                <!-- <h1>Stopwatch Defense</h1> -->
                <div class="difficulty-container">
                    <button class="diff-btn" data-diff="EASY">EASY</button>
                    <button class="diff-btn" data-diff="NORMAL">NORMAL</button>
                    <button class="diff-btn" data-diff="HARD">HARD</button>
                    <button class="diff-btn" data-diff="HELL">HELL</button>
                </div>
                <button id="ranking-btn" style="margin-top: 30px; font-size: 20px; background: rgba(0,0,0,0.7); color: gold; border: 1px solid gold;">RANKING</button>
            </div>
            <div id="game-over-screen" class="screen hidden">
                <h1>Game Over</h1>
                <p>Score: <span id="final-score">0</span></p>
                <button id="restart-btn">Restart</button>
            </div>
            
            <div id="ending-screen" class="screen hidden" style="background: black; padding: 0;">
                <video id="ending-video" src="video/ending.mp4" style="width: 100%; height: 100%; object-fit: cover;"></video>
            </div>
            
            <div id="name-input-screen" class="screen hidden" style="z-index: 500;">
                <h2 style="color: #00ff88;">NEW RECORD!</h2>
                <p>글로벌 랭킹에 등록할 이름을 입력하세요</p>
                <input type="text" id="nickname-input" maxlength="10" placeholder="Player" style="font-family: inherit; font-size: 24px; text-align: center; padding: 10px; margin: 20px 0; background: rgba(0,0,0,0.5); color: #fff; border: 2px solid #00ff88;">
                <button id="submit-name-btn">SUBMIT</button>
            </div>

            <div id="ranking-screen" class="screen hidden" style="z-index: 400; background: rgba(0, 0, 0, 0.95);">
                <h1 style="color: gold; text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);">GLOBAL RECORDS</h1>
                
                <div class="ranking-tabs">
                    <button class="rank-tab-btn active" data-target="EASY">EASY</button>
                    <button class="rank-tab-btn" data-target="NORMAL">NORMAL</button>
                    <button class="rank-tab-btn" data-target="HARD">HARD</button>
                    <button class="rank-tab-btn" data-target="HELL">HELL</button>
                </div>

                <div class="ranking-container" style="flex-direction: row; gap: 20px; width: 90%; max-width: 800px; overflow-y: auto; max-height: 60vh;">
                    <div class="ranking-section" style="flex: 1;">
                        <h2 style="font-size: 20px; margin-bottom: 10px; color: #00ff88;">BEST CLEAR TIME</h2>
                        <table id="time-rank-table" class="rank-table" style="font-size: 14px;">
                            <thead><tr><th>Rank</th><th>Name</th><th>Time</th></tr></thead>
                            <tbody id="time-rank-body">
                                <!-- JS will populate 10 rows -->
                            </tbody>
                        </table>
                    </div>
                    <div class="ranking-section" style="flex: 1;">
                        <h2 style="font-size: 20px; margin-bottom: 10px; color: #ff0055;">HIGH SCORE</h2>
                        <table id="score-rank-table" class="rank-table" style="font-size: 14px;">
                            <thead><tr><th>Rank</th><th>Name</th><th>Score</th></tr></thead>
                            <tbody id="score-rank-body">
                                <!-- JS will populate 10 rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- 하단 내 로컬 기록 표시창 -->
                <div id="local-record-text" style="color: #aaa; margin-top: 10px; font-size: 14px;"></div>

                <button id="close-ranking-btn" style="margin-top: 15px; border: 1px solid #fff; background: rgba(0,0,0,0.5); color: #fff;">CLOSE</button>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js?v=5"></script>
</body>

</html>
